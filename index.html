<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NusaNode</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b0b0f;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 40px 20px;
            text-align: center;
        }

        .logo {
            width: 130px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .description {
            color: #aaa;
            margin-bottom: 30px;
        }

        .link {
            display: block;
            text-decoration: none;
            color: white;
            background: #17171d;
            border: 1px solid #292932;
            padding: 17px;
            margin: 14px 0;
            border-radius: 14px;
            font-size: 16px;
            transition: 0.2s;
        }

        .link:hover {
            transform: translateY(-3px);
            background: #202027;
            border-color: #555;
        }

        footer {
            margin-top: 35px;
            color: #666;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Logo NusaNode -->
        <img src="logo.png" class="logo" alt="NusaNode">

        <h1>NusaNode</h1>

        <p class="description">
            Minecraft Server • Community • Services
        </p>

        <!-- Link -->
        <a href="https://discord.gg/mQPn4ycqD" class="link">
            💬 Discord NusaNode
        </a>

        <a href="https://whatsapp.com/channel/0029VbE4KQ84SpkKxH5Bwi1f" class="link">

        </a>

        <a href="jasa.html" class="Link">
            🛠️ Daftar Jasa NusaNode
        </a>

        <a href="LINK_TIKTOK" class="link">
            🎵 TikTok NusaNode
        </a>

        <a href="LINK_YOUTUBE" class="link">
            ▶️ YouTube NusaNode
        </a>

        <footer>
            © 2026 NusaNode
        </footer>

    </div>

</body>
</html>
